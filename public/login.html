<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · 1M Checkboxes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #06070a;
        --surface: #0e0f14;
        --surface2: #13151c;
        --border: #1c1f2b;
        --border2: #252837;
        --muted: #363a4e;
        --dim: #555970;
        --text: #bfc3d4;
        --text-bright: #e8ebf5;
        --accent: #00e5ff;
        --accent-dim: rgba(0, 229, 255, 0.12);
        --accent-glow: rgba(0, 229, 255, 0.3);
        --warn: #ff6b35;
        --warn-dim: rgba(255, 107, 53, 0.12);
        --warn-border: rgba(255, 107, 53, 0.4);
        --success: #39d98a;
        --success-dim: rgba(57, 217, 138, 0.1);
        --font-mono: "Space Mono", monospace;
        --font-disp: "Syne", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-mono);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        cursor: default;
      }

      /* scanline */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.03) 2px,
          rgba(0, 0, 0, 0.03) 4px
        );
        pointer-events: none;
        z-index: 9999;
      }

      /* grid bg glow */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse 60% 50% at 50% 0%,
          rgba(0, 229, 255, 0.06) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      /* ── HEADER ── */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(6, 7, 10, 0.9);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        padding: 0 clamp(1.25rem, 4vw, 3.5rem);
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 58px;
        flex-shrink: 0;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
      }

      .logo-mark {
        width: 28px;
        height: 28px;
        border: 1.5px solid var(--accent);
        border-radius: 4px;
        display: grid;
        place-items: center;
        box-shadow:
          0 0 12px var(--accent-glow),
          inset 0 0 8px rgba(0, 229, 255, 0.05);
      }

      .logo-mark::after {
        content: "✓";
        color: var(--accent);
        font-size: 13px;
        font-family: var(--font-mono);
        text-shadow: 0 0 8px var(--accent);
      }

      .logo-text {
        font-family: var(--font-disp);
        font-weight: 800;
        font-size: 1rem;
        color: var(--text-bright);
        letter-spacing: -0.02em;
      }

      .logo-text span {
        color: var(--accent);
        text-shadow: 0 0 12px var(--accent-glow);
      }

      .header-link {
        font-size: 0.68rem;
        color: var(--dim);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        border: 1px solid var(--border);
        padding: 0.35rem 0.9rem;
        border-radius: 4px;
        background: var(--surface);
        transition: all 0.2s;
      }

      .header-link:hover {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-dim);
      }

      /* ── MAIN ── */
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.25rem;
        position: relative;
        z-index: 1;
      }

      .card {
        width: 100%;
        max-width: 420px;
      }

      /* eyebrow */
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.62rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 1.25rem;
      }

      .eyebrow::before {
        content: "";
        width: 20px;
        height: 1px;
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent-glow);
      }

      h1 {
        font-family: var(--font-disp);
        font-weight: 800;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        color: var(--text-bright);
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin-bottom: 0.5rem;
      }

      h1 em {
        font-style: italic;
        color: var(--accent);
        text-shadow: 0 0 20px var(--accent-glow);
      }

      .subtitle {
        font-size: 0.72rem;
        color: var(--dim);
        letter-spacing: 0.06em;
        margin-bottom: 2.5rem;
        line-height: 1.7;
      }

      /* ── FORM ── */
      .form-group {
        margin-bottom: 1.1rem;
      }

      label {
        display: block;
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 0.45rem;
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 0.75rem 1rem;
        font-family: var(--font-mono);
        font-size: 0.82rem;
        color: var(--text-bright);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
        cursor: text;
      }

      input::placeholder {
        color: var(--muted);
      }

      input:focus {
        border-color: var(--accent);
        background: var(--surface2);
        box-shadow:
          0 0 0 3px rgba(0, 229, 255, 0.08),
          0 0 12px rgba(0, 229, 255, 0.04);
      }

      input.error {
        border-color: var(--warn-border);
        box-shadow: 0 0 0 3px var(--warn-dim);
      }

      .field-error {
        font-size: 0.62rem;
        color: var(--warn);
        letter-spacing: 0.06em;
        margin-top: 0.4rem;
        display: none;
      }

      .field-error.show {
        display: block;
      }

      /* divider */
      .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.75rem 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .divider span {
        font-size: 0.6rem;
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* ── BUTTONS ── */
      .btn-iris {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        padding: 0.85rem 1.5rem;
        background: var(--accent);
        color: #06070a;
        border: none;
        border-radius: 6px;
        font-family: var(--font-disp);
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow:
          0 0 20px rgba(0, 229, 255, 0.25),
          0 0 40px rgba(0, 229, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .btn-iris::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.15) 0%,
          transparent 60%
        );
        pointer-events: none;
      }

      .btn-iris:hover {
        transform: translateY(-1px);
        box-shadow:
          0 0 30px rgba(0, 229, 255, 0.4),
          0 0 60px rgba(0, 229, 255, 0.15);
      }

      .btn-iris:active {
        transform: translateY(0);
      }

      .btn-iris:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .iris-icon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(6, 7, 10, 0.5);
        position: relative;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .iris-icon::after {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(6, 7, 10, 0.6);
      }

      .btn-secondary {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        padding: 0.8rem 1.5rem;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border2);
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 0.75rem;
      }

      .btn-secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
      }

      /* ── TOAST SYSTEM ── */
      #toast-container {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        z-index: 1000;
        pointer-events: none;
      }

      .toast {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        background: var(--surface2);
        border: 1px solid var(--border2);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        line-height: 1.5;
        max-width: 320px;
        pointer-events: all;
        transform: translateX(120%);
        opacity: 0;
        transition:
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.25s;
        cursor: pointer;
      }

      .toast.show {
        transform: translateX(0);
        opacity: 1;
      }

      .toast.hiding {
        transform: translateX(120%);
        opacity: 0;
        transition:
          transform 0.25s ease-in,
          opacity 0.2s;
      }

      .toast-icon {
        font-size: 1rem;
        line-height: 1;
        flex-shrink: 0;
        margin-top: 0.05rem;
      }

      .toast-body {
        flex: 1;
      }
      .toast-title {
        font-family: var(--font-disp);
        font-weight: 700;
        font-size: 0.78rem;
        margin-bottom: 0.15rem;
      }
      .toast-msg {
        color: var(--dim);
      }

      /* variants */
      .toast.error {
        border-color: var(--warn-border);
        background: #0f0d0c;
      }
      .toast.error .toast-title {
        color: var(--warn);
      }
      .toast.success {
        border-color: rgba(57, 217, 138, 0.35);
        background: #0a0f0d;
      }
      .toast.success .toast-title {
        color: var(--success);
      }
      .toast.info {
        border-color: rgba(0, 229, 255, 0.25);
      }
      .toast.info .toast-title {
        color: var(--accent);
      }

      /* progress bar */
      .toast-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        border-radius: 0 0 8px 8px;
        width: 100%;
        transform-origin: left;
        transition: transform linear;
      }
      .toast {
        position: relative;
      }
      .toast.error .toast-progress {
        background: var(--warn);
      }
      .toast.success .toast-progress {
        background: var(--success);
      }
      .toast.info .toast-progress {
        background: var(--accent);
      }

      /* ── FOOTER ── */
      .card-footer {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.68rem;
        color: var(--dim);
        letter-spacing: 0.06em;
      }

      .card-footer a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s;
      }

      .card-footer a:hover {
        border-color: var(--accent);
      }

      /* spinner inside button */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .spin {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(6, 7, 10, 0.3);
        border-top-color: #06070a;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="logo">
        <div class="logo-mark"></div>
        <div class="logo-text"><span>1M</span> Checkboxes</div>
      </a>
      <a href="/signup" class="header-link">Sign up</a>
    </header>

    <main>
      <div class="card">
        <div class="eyebrow">Welcome back</div>
        <h1>Log back<br /><em>in.</em></h1>
        <p class="subtitle">
          Your boxes are waiting. Pick up where you left off.
        </p>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
          <div class="field-error" id="email-error">
            Please enter a valid email address.
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <div class="field-error" id="password-error">
            Password is required.
          </div>
        </div>

        <div class="divider"><span>continue with</span></div>

        <button class="btn-iris" id="login-btn" onclick="handleLogin()">
          <div class="iris-icon"></div>
          Login with Iris
        </button>

        <button class="btn-secondary" onclick="handleEmailLogin()">
          Login with email
        </button>

        <div class="card-footer">
          Don't have an account? <a href="/signup">Sign up</a>
        </div>
      </div>
    </main>

    <div id="toast-container"></div>

    <script>
      // ── TOAST SYSTEM ──
      // Usage from your backend integration:
      //   showToast('error',   'Rate limited',      'Too many attempts. Try again in 30s.')
      //   showToast('success', 'Logged in',         'Welcome back!')
      //   showToast('info',    'Session expired',   'Please log in again.')
      function showToast(type, title, message, duration = 4000) {
        const container = document.getElementById("toast-container");

        const toast = document.createElement("div");
        toast.className = `toast ${type}`;

        const icons = { error: "⚠", success: "✓", info: "ⓘ" };

        toast.innerHTML = `
          <div class="toast-icon">${icons[type] ?? "ⓘ"}</div>
          <div class="toast-body">
            <div class="toast-title">${title}</div>
            <div class="toast-msg">${message}</div>
          </div>
          <div class="toast-progress"></div>
        `;

        container.appendChild(toast);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => toast.classList.add("show"));
        });

        // shrink progress bar
        const bar = toast.querySelector(".toast-progress");
        bar.style.transition = `transform ${duration}ms linear`;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            bar.style.transform = "scaleX(0)";
          });
        });

        const dismiss = () => {
          toast.classList.add("hiding");
          toast.addEventListener("transitionend", () => toast.remove(), {
            once: true,
          });
        };

        toast.addEventListener("click", dismiss);
        setTimeout(dismiss, duration);

        return toast;
      }

      // ── VALIDATION ──
      function validateEmail(val) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());
      }

      function setFieldError(inputId, errorId, show) {
        const input = document.getElementById(inputId);
        const error = document.getElementById(errorId);
        input.classList.toggle("error", show);
        error.classList.toggle("show", show);
        return !show;
      }

      // ── LOGIN WITH IRIS ──
      async function handleLogin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        let valid = true;
        valid =
          setFieldError("email", "email-error", !validateEmail(email)) && valid;
        valid =
          setFieldError("password", "password-error", !password.trim()) &&
          valid;

        if (!valid) {
          showToast(
            "error",
            "Missing fields",
            "Please fill in all required fields.",
          );
          return;
        }

        const btn = document.getElementById("login-btn");
        btn.disabled = true;
        btn.innerHTML = `<div class="spin"></div> Signing in…`;

        try {
          // 👇 Replace this with your actual auth call
          const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email.trim(), password }),
          });

          if (res.status === 429) {
            // Rate limit — your backend should emit this
            showToast(
              "error",
              "Rate limited",
              "Too many login attempts. Please wait a moment.",
            );
            return;
          }

          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            showToast(
              "error",
              "Login failed",
              data.message ?? "Invalid email or password.",
            );
            return;
          }

          showToast(
            "success",
            "Welcome back!",
            "Redirecting you to your boxes…",
          );
          setTimeout(() => {
            window.location.href = "/";
          }, 1200);
        } catch (err) {
          showToast(
            "error",
            "Network error",
            "Could not reach the server. Try again.",
          );
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<div class="iris-icon"></div> Login with Iris`;
        }
      }

      // plain email login (no Iris) — wire to your own handler
      function handleEmailLogin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        let valid = true;
        valid =
          setFieldError("email", "email-error", !validateEmail(email)) && valid;
        valid =
          setFieldError("password", "password-error", !password.trim()) &&
          valid;

        if (!valid) return;

        // TODO: wire to your own email/password handler
        showToast("info", "Coming soon", "Email login is not yet enabled.");
      }

      // clear errors on input
      document
        .getElementById("email")
        .addEventListener("input", () =>
          setFieldError("email", "email-error", false),
        );
      document
        .getElementById("password")
        .addEventListener("input", () =>
          setFieldError("password", "password-error", false),
        );

      // submit on Enter
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleLogin();
      });
    </script>
  </body>
</html>
